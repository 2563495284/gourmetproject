<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日常行动随机 GM</title>
  <style>
    :root { color-scheme: dark; --bg:#15110f; --panel:#221a16; --panel2:#2c221d; --line:#4b392f; --text:#f8ead8; --muted:#c8b49e; --accent:#ffb84d; --green:#69d3a0; --red:#ff776d; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 0,#382418 0,var(--bg) 42rem); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:5; padding:22px 28px 16px; border-bottom:1px solid var(--line); background:rgba(21,17,15,.9); backdrop-filter:blur(12px); }
    h1,h2,h3 { margin:0; } h1 { font-size:25px; } h2 { font-size:20px; } h3 { font-size:16px; }
    .hint,small { color:var(--muted); }
    main { max-width:1500px; margin:auto; padding:22px 28px 48px; }
    .toolbar,.panel,.status,.week,.group { border:1px solid var(--line); border-radius:15px; background:rgba(34,26,22,.94); box-shadow:0 12px 34px rgba(0,0,0,.18); }
    .toolbar { display:grid; grid-template-columns:repeat(7,minmax(120px,1fr)); gap:12px; align-items:end; padding:16px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    input,select,button { min-height:40px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; color:var(--text); background:var(--panel2); font:inherit; }
    button { cursor:pointer; color:#27160b; border-color:#eea137; background:linear-gradient(#ffc36a,#e68d27); font-weight:700; }
    button.secondary { color:var(--text); border-color:var(--line); background:var(--panel2); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .wide { grid-column:span 2; }
    .status { margin:14px 0; padding:11px 14px; color:var(--muted); }
    .status.ok { color:var(--green); } .status.error { color:var(--red); }
    .tabs { display:inline-flex; gap:5px; margin:14px 0; padding:5px; border:1px solid var(--line); border-radius:12px; }
    .tabs button { min-width:145px; color:var(--muted); background:transparent; border:0; }
    .tabs button.active { color:#27160b; background:linear-gradient(#ffc36a,#e68d27); }
    .panel { padding:17px; }
    .panel-head,.week-head,.group-head { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    .panel-head { margin-bottom:12px; }
    .hidden { display:none !important; }
    .summary { display:grid; grid-template-columns:repeat(5,minmax(135px,1fr)); gap:9px; margin:12px 0; }
    .card { padding:10px 11px; border:1px solid var(--line); border-radius:11px; background:rgba(44,34,29,.8); }
    .card strong { display:block; color:var(--accent); font-size:17px; }
    .week { margin:13px 0; padding:13px; background:rgba(44,34,29,.88); }
    .group { margin:10px 0; padding:12px; background:rgba(21,17,15,.42); }
    .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .chip { padding:3px 7px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:#392a22; font-size:12px; }
    .chip.active { color:#dffff0; border-color:rgba(105,211,160,.65); background:rgba(105,211,160,.12); }
    .scroll { overflow:auto; border-radius:10px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { padding:8px 7px; border-bottom:1px solid rgba(75,57,47,.7); text-align:left; vertical-align:top; }
    th { white-space:nowrap; color:var(--muted); background:rgba(21,17,15,.5); }
    tr:last-child td { border-bottom:0; }
    code { color:#ffe1ad; }
    details { margin-top:10px; color:var(--muted); } summary { cursor:pointer; color:var(--accent); }
    pre { max-height:260px; overflow:auto; white-space:pre-wrap; padding:10px; border:1px solid var(--line); border-radius:9px; background:rgba(21,17,15,.6); }
    .bars { display:grid; gap:8px; margin-top:10px; }
    .bar { display:grid; grid-template-columns:minmax(145px,.7fr) minmax(220px,2fr); gap:10px; align-items:center; }
    .track { position:relative; min-height:36px; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:rgba(21,17,15,.5); }
    .fill { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,rgba(255,184,77,.62),rgba(105,211,160,.48)); }
    .values { position:relative; z-index:1; padding:7px; }
    .progress { height:11px; overflow:hidden; margin:12px 0; border:1px solid var(--line); border-radius:999px; }
    .progress div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--green)); }
    @media(max-width:1050px){.toolbar{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){header,main{padding-left:13px;padding-right:13px}.toolbar{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.bar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>日常行动随机 GM</h1>
    <p class="hint">按新规则展示行动数洗牌袋、逐卡类别/奖励上下限和本周累计次数；上保底达到后屏蔽，事件奖励固定为“未知”。</p>
  </header>
  <main>
    <section class="toolbar">
      <label>随机种子<input id="seed" value="gm-preview"></label>
      <label>每周生成组数<input id="groupsPerWeek" type="number" min="1" max="200" value="10"></label>
      <label>事件类别增幅（%）<input id="eventBonus" type="number" step="1" value="0"></label>
      <label>火热类别增幅（%）<input id="hotBonus" type="number" step="1" value="0"></label>
      <label>批量局数<select id="batchCount"><option>1000</option><option selected>10000</option><option>100000</option></select></label>
      <button id="reload" class="secondary">重新读取配置</button>
      <label class="wide">自动读取失败时选择 GourmetProject/Assets/StreamingAssets/Config 目录<input id="files" type="file" multiple webkitdirectory></label>
    </section>
    <section id="configStatus" class="status">正在读取配置……</section>
    <div class="tabs">
      <button id="singleTab" class="active">随机一局</button>
      <button id="batchTab">批量分布</button>
    </div>
    <section id="singlePanel" class="panel">
      <div class="panel-head"><div><h2>逐组明细</h2><small>组内重复与累计上限屏蔽先于下保底；重跑等同新开局。</small></div><button id="runSingle">按当前参数重跑</button></div>
      <div id="singleStatus" class="status">配置加载后自动生成。</div>
      <div id="singleOutput"></div>
    </section>
    <section id="batchPanel" class="panel hidden">
      <div class="panel-head"><div><h2>行动数、类别与奖励分布</h2><small>每局独立重置每周洗牌袋和累计计数。</small></div><button id="runBatch">开始统计</button></div>
      <div class="progress"><div id="progress"></div></div>
      <div id="batchStatus" class="status">选择局数后开始统计。</div>
      <div id="batchOutput"></div>
    </section>
  </main>
  <script>
  "use strict";
  const DIR="../../Assets/StreamingAssets/Config/";
  const CONFIG_HINT="GourmetProject/Assets/StreamingAssets/Config";
  const FILES=["tbaction","tbfood","tbactionchoicecountrule","tbactioncategoryrule","tbactionrewardrule"];
  const CATEGORY={Daily:1,Hot:2,Event:3};
  const CATEGORY_NAME={1:"日常",2:"火热",3:"事件"};
  const REWARD_NAME={1:"金币",3:"装饰品",5:"餐桌格",6:"强化箱",7:"调整单"};
  const FOOD={Normal:0,Super:1,Feast:2};
  const EVENT_BEHAVIOR=0, FOOD_BEHAVIOR=1;
  const $=id=>document.getElementById(id);
  let tables=null,diagnostics=[];

  const MASK64=(1n<<64n)-1n, MASK32=(1n<<32n)-1n;
  const FNV_OFFSET=14695981039346656037n,FNV_PRIME=1099511628211n,GAMMA=0x9E3779B97F4A7C15n,M1=0xBF58476D1CE4E5B9n,M2=0x94D049BB133111EBn;
  const u64=v=>v&MASK64;
  function fnv(text){let h=FNV_OFFSET,s=String(text??"");for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h=u64((h^BigInt(c&255))*FNV_PRIME);h=u64((h^BigInt((c>>8)&255))*FNV_PRIME);}return h;}
  function split(holder){holder.v=u64(holder.v+GAMMA);let v=holder.v;v=u64((v^(v>>30n))*M1);v=u64((v^(v>>27n))*M2);return u64(v^(v>>31n));}
  function seedOf(text){if(/^\d+$/.test(String(text))){const n=BigInt(text);if(n<=MASK64)return n;}return fnv(text);}
  class Rng{
    constructor(seed){const h={v:u64(seed)};this.s=[split(h),split(h),split(h),split(h)];if((this.s[0]|this.s[1]|this.s[2]|this.s[3])===0n)this.s[0]=GAMMA;}
    rot(v,k){const b=BigInt(k);return u64((u64(v)<<b)|(u64(v)>>(64n-b)));}
    ulong(){let[a,b,c,d]=this.s;const out=u64(this.rot(u64(b*5n),7)*9n),t=u64(b<<17n);c=u64(c^a);d=u64(d^b);b=u64(b^c);a=u64(a^d);c=u64(c^t);d=this.rot(d,45);this.s=[a,b,c,d];return out;}
    uint(){return Number((this.ulong()>>32n)&MASK32);}
    range(min,max){if(max<=min)return min;const bound=(max-min)>>>0;let x=this.uint(),m=BigInt(x)*BigInt(bound),low=Number(m&MASK32);if(low<bound){const threshold=Number(((1n<<32n)-BigInt(bound))%BigInt(bound));while(low<threshold){x=this.uint();m=BigInt(x)*BigInt(bound);low=Number(m&MASK32);}}return min+Number((m>>32n)&MASK32);}
    double(){return Number(this.ulong()>>11n)/9007199254740992;}
    weighted(weights){const safe=weights.map(w=>Number.isFinite(+w)&&+w>0?+w:0),total=safe.reduce((a,b)=>a+b,0);if(!(total>0))return this.range(0,weights.length);let roll=this.double()*total,acc=0;for(let i=0;i<safe.length;i++){acc+=safe[i];if(roll<acc)return i;}return safe.length-1;}
    shuffle(list){for(let i=list.length-1;i>0;i--){const j=this.range(0,i+1);[list[i],list[j]]=[list[j],list[i]];}return list;}
  }
  function streamSeed(master,name){let combined=u64(master);combined=u64(combined^u64(fnv(name)+GAMMA+u64(combined<<6n)+(combined>>2n)));return split({v:combined});}
  function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
  function byId(rows){return new Map((rows||[]).map(row=>[String(row.id),row]));}
  function weekly(values,week,fallback=0){if(!Array.isArray(values)||!values.length)return fallback;return Number(values[Math.min(Math.max(0,week-1),values.length-1)]);}
  function guarantee(rule,field,week,index,bonus=0){const row=rule?.[field]?.[week-1];if(!Array.isArray(row)||index<0||index>=row.length)return null;const value=Number(row[index]);if(!Number.isFinite(value)||value<0)return null;return Math.max(0,Math.round(value*Math.max(0,1+bonus)));}
  function bonusFor(category){if(category===CATEGORY.Event)return Number($("eventBonus").value||0)/100;if(category===CATEGORY.Hot)return Number($("hotBonus").value||0)/100;return 0;}
  function addDiag(text){if(!diagnostics.includes(text)&&diagnostics.length<80)diagnostics.push(text);}

  function buildTables(raw){
    const t={action:raw.tbaction||[],food:raw.tbfood||[],countRules:raw.tbactionchoicecountrule||[],categoryRules:raw.tbactioncategoryrule||[],rewardRules:raw.tbactionrewardrule||[]};
    t.foodById=byId(t.food);t.actionMap=new Map();t.mappingCount=new Map();t.eventActions=[];
    for(const action of t.action){
      if(+action.behavior===EVENT_BEHAVIOR){t.eventActions.push(action);continue;}
      if(+action.behavior!==FOOD_BEHAVIOR)continue;
      const food=t.foodById.get(String(action.foodId));if(!food||+food.actionKind===FOOD.Feast)continue;
      const category=+food.actionKind===FOOD.Super?CATEGORY.Hot:CATEGORY.Daily,key=`${category}:${+food.rewardKind}`;
      t.mappingCount.set(key,(t.mappingCount.get(key)||0)+1);if(!t.actionMap.has(key))t.actionMap.set(key,action);
    }
    validate(t);return t;
  }
  function validate(t){
    diagnostics=[];
    if(t.eventActions.length!==1)addDiag(`事件随机池需要 1 个行动壳，当前 ${t.eventActions.length} 个。`);
    const cats=new Set();for(const rule of t.categoryRules){if(cats.has(+rule.category))addDiag(`类别规则重复：${rule.category}`);cats.add(+rule.category);validateWeights(rule);validateGuarantees(rule);}
    const rewards=new Set();for(const rule of t.rewardRules){if(rewards.has(+rule.rewardKind))addDiag(`奖励规则重复：${rule.rewardKind}`);rewards.add(+rule.rewardKind);validateWeights(rule);validateGuarantees(rule);}
    const counts=new Set();for(const rule of t.countRules){if(counts.has(+rule.choiceCount))addDiag(`行动数规则重复：${rule.choiceCount}`);counts.add(+rule.choiceCount);if(![2,3].includes(+rule.choiceCount))addDiag(`行动数只能为 2/3：${rule.choiceCount}`);if((rule.weeklyWeights||[]).some(v=>!Number.isInteger(+v)||+v<0))addDiag(`行动数票数必须为非负整数：${rule.id}`);}
    for(const category of [CATEGORY.Daily,CATEGORY.Hot])for(const reward of rewards){const n=t.mappingCount.get(`${category}:${reward}`)||0;if(n!==1)addDiag(`${CATEGORY_NAME[category]} + ${REWARD_NAME[reward]||reward} 映射了 ${n} 个行动。`);}
  }
  function validateWeights(rule){for(const value of rule.fallbackWeights||[])if(!Number.isFinite(+value)||+value<0)addDiag(`${rule.id} 存在非法权重 ${value}`);}
  function validateGuarantees(rule){const mins=rule.minGuaranteeCounts||[],maxs=rule.maxGuaranteeCounts||[],weeks=Math.max(mins.length,maxs.length);for(let week=0;week<weeks;week++){const minRow=mins[week]||[],maxRow=maxs[week]||[],cards=Math.max(minRow.length,maxRow.length);for(let card=0;card<cards;card++){const min=Number(minRow[card]),max=Number(maxRow[card]);if(Number.isFinite(min)&&min>=0&&Number.isFinite(max)&&max>=0&&min>max)addDiag(`${rule.id} 第 ${week+1} 周第 ${card+1} 张：下保底 ${min} 大于上限 ${max}`);}}}
  function newWeekState(week){return{week,bag:[],candidate:0,serial:0,categoryCounts:new Map(),rewardCounts:new Map()};}
  function refillBag(state,rng){state.bag=[];for(const rule of tables.countRules){const tickets=weekly(rule.weeklyWeights,state.week,0);if(!Number.isInteger(tickets)||tickets<0)continue;for(let i=0;i<tickets;i++)state.bag.push(+rule.choiceCount);}rng.shuffle(state.bag);}
  function belowMaximum(rule,count,week,index,bonus=0){const maximum=guarantee(rule,"maxGuaranteeCounts",week,index,bonus);return maximum===null||count<maximum;}
  function legalRewards(category,used,state){return tables.rewardRules.filter(rule=>!used.has(+rule.rewardKind)&&belowMaximum(rule,state.rewardCounts.get(+rule.rewardKind)||0,state.week,state.candidate)&&(tables.mappingCount.get(`${category}:${+rule.rewardKind}`)||0)===1);}
  function choose(rules,countFn,week,index,rng,bonusFn=()=>0){
    let candidates=rules.filter(rule=>{const target=guarantee(rule,"minGuaranteeCounts",week,index,bonusFn(rule));return target!==null&&countFn(rule)<target;});let phase="下保底";
    if(!candidates.length){candidates=[...rules];phase="自由权重";}
    if(!candidates.length)return null;
    const weights=candidates.map(rule=>Math.max(0,weekly(rule.fallbackWeights,week,0))*Math.max(0,1+bonusFn(rule)));
    const selected=candidates[rng.weighted(weights)];
    return{selected,phase,weight:weights[candidates.indexOf(selected)],pool:candidates.map((rule,i)=>`${rule.name||rule.id}:${weights[i]}`)};
  }
  function generateGroup(state,rng){
    if(!state.bag.length)refillBag(state,rng);if(!state.bag.length)return null;
    const bagBefore=[...state.bag],choiceCount=state.bag.pop();state.serial++;
    const cards=[],usedRewards=new Map([[CATEGORY.Daily,new Set()],[CATEGORY.Hot,new Set()]]);let eventUsed=false;
    for(let slot=0;slot<choiceCount;slot++){
      const legalCategories=tables.categoryRules.filter(rule=>{const c=+rule.category;if(!belowMaximum(rule,state.categoryCounts.get(c)||0,state.week,state.candidate,bonusFor(c)))return false;if(c===CATEGORY.Event)return !eventUsed&&tables.eventActions.length===1;return legalRewards(c,usedRewards.get(c)||new Set(),state).length>0;});
      const categoryPick=choose(legalCategories,r=>state.categoryCounts.get(+r.category)||0,state.week,state.candidate,rng,r=>bonusFor(+r.category));if(!categoryPick)break;
      const category=+categoryPick.selected.category,categoryBefore=state.categoryCounts.get(category)||0;let rewardPick=null,reward=null,action=null,rewardBefore=null;
      if(category===CATEGORY.Event){eventUsed=true;action=tables.eventActions[0];}
      else{const legal=legalRewards(category,usedRewards.get(category),state);rewardPick=choose(legal,r=>state.rewardCounts.get(+r.rewardKind)||0,state.week,state.candidate,rng);if(!rewardPick)break;reward=+rewardPick.selected.rewardKind;rewardBefore=state.rewardCounts.get(reward)||0;usedRewards.get(category).add(reward);action=tables.actionMap.get(`${category}:${reward}`);}
      if(!action)break;
      cards.push({slot:slot+1,index:state.candidate+1,category,categoryBefore,categoryPick,reward,rewardBefore,rewardPick,action});
      state.categoryCounts.set(category,categoryBefore+1);if(reward!==null)state.rewardCounts.set(reward,rewardBefore+1);state.candidate++;
    }
    return{serial:state.serial,choiceCount,bagBefore,bagAfter:[...state.bag],cards};
  }
  function simulate(seed,groupsPerWeek,keepGroups=true){const master=seedOf(seed),weeks=[];for(let week=1;week<=4;week++){const state=newWeekState(week),groups=[];for(let g=0;g<groupsPerWeek;g++){const rng=new Rng(streamSeed(master,`action_w${week}_g${g+1}`)),group=generateGroup(state,rng);if(group&&keepGroups)groups.push(group);}weeks.push({state,groups});}return weeks;}
  function countsText(map,names){return Array.from(map.entries()).sort((a,b)=>a[0]-b[0]).map(([k,v])=>`${names[k]||k} ${v}`).join(" · ")||"无";}
  function targetText(rule,week,index,bonus=0){const min=guarantee(rule,"minGuaranteeCounts",week,index,bonus),max=guarantee(rule,"maxGuaranteeCounts",week,index,bonus);return `${min===null?"—":min} / ${max===null?"—":max}`;}
  function diagHtml(){return diagnostics.length?`<details><summary>配置诊断 ${diagnostics.length} 条</summary><pre>${esc(diagnostics.join("\n"))}</pre></details>`:"";}
  function renderSingle(){if(!tables)return;const groups=Math.max(1,Math.min(200,+$("groupsPerWeek").value||10)),weeks=simulate($("seed").value,groups,true);let html=diagHtml();for(const week of weeks){const s=week.state;html+=`<section class="week"><div class="week-head"><h3>第 ${week.state.week} 周</h3><div class="chips"><span class="chip">候选卡 ${s.candidate}</span><span class="chip">剩余袋 [${s.bag.join(", ")||"空"}]</span></div></div><div class="summary"><div class="card"><strong>${s.serial}</strong><small>生成组数</small></div><div class="card"><strong>${s.candidate}</strong><small>累计候选卡</small></div><div class="card"><strong>${esc(countsText(s.categoryCounts,CATEGORY_NAME))}</strong><small>类别累计</small></div><div class="card"><strong>${esc(countsText(s.rewardCounts,REWARD_NAME))}</strong><small>奖励累计</small></div></div>`;
      for(const group of week.groups){html+=`<section class="group"><div class="group-head"><h3>组 ${group.serial} · ${group.choiceCount} 张</h3><div class="chips"><span class="chip">抽前 [${group.bagBefore.join(", ")}]</span><span class="chip active">抽后 [${group.bagAfter.join(", ")||"空"}]</span></div></div><div class="scroll"><table><thead><tr><th>卡/累计序号</th><th>类别阶段</th><th>类别计数→结果</th><th>类别目标 min/max</th><th>奖励阶段</th><th>奖励计数→结果</th><th>奖励目标 min/max</th><th>具体行动</th></tr></thead><tbody>`;
        for(const card of group.cards){const cr=card.categoryPick.selected,rr=card.rewardPick?.selected;html+=`<tr><td>${card.slot} / ${card.index}</td><td><strong>${card.categoryPick.phase}</strong><br><small>${esc(card.categoryPick.pool.join(" · "))}</small></td><td>${CATEGORY_NAME[card.category]} ${card.categoryBefore}→${card.categoryBefore+1}</td><td>${targetText(cr,week.state.week,card.index-1,bonusFor(card.category))}</td><td>${card.rewardPick?`<strong>${card.rewardPick.phase}</strong><br><small>${esc(card.rewardPick.pool.join(" · "))}</small>`:"未知（不抽奖励）"}</td><td>${card.reward===null?"未知（不计数）":`${REWARD_NAME[card.reward]} ${card.rewardBefore}→${card.rewardBefore+1}`}</td><td>${rr?targetText(rr,week.state.week,card.index-1):"—"}</td><td><code>${esc(card.action.id)}</code></td></tr>`;}
        html+=`</tbody></table></div></section>`;}html+=`</section>`;}$("singleOutput").innerHTML=html;$("singleStatus").className="status ok";$("singleStatus").textContent=`已生成 4 周 × ${groups} 组。`;
  }
  function emptyStats(){return Array.from({length:4},()=>({groups:0,cards:0,counts:new Map(),categories:new Map(),rewards:new Map()}));}
  function inc(map,key,n=1){map.set(key,(map.get(key)||0)+n);}
  function bars(map,names,total){const max=Math.max(1,...map.values());return `<div class="bars">${Array.from(map.entries()).sort((a,b)=>a[0]-b[0]).map(([key,value])=>`<div class="bar"><div><strong>${esc(names[key]||key)}</strong><br><small>${value.toLocaleString()} 次</small></div><div class="track"><div class="fill" style="width:${100*value/max}%"></div><div class="values">${total?`${(100*value/total).toFixed(2)}%`:"0%"}</div></div></div>`).join("")}</div>`;}
  async function runBatch(){if(!tables)return;const runs=Math.max(1,+$("batchCount").value||1000),groups=Math.max(1,Math.min(200,+$("groupsPerWeek").value||10)),stats=emptyStats(),masterSeed=$("seed").value;$("runBatch").disabled=true;for(let runIndex=0;runIndex<runs;runIndex++){const weeks=simulate(`${masterSeed}#${runIndex}`,groups,true);weeks.forEach((week,i)=>{const st=stats[i];for(const group of week.groups){st.groups++;inc(st.counts,group.choiceCount);for(const card of group.cards){st.cards++;inc(st.categories,card.category);if(card.reward!==null)inc(st.rewards,card.reward);}}});if(runIndex%250===0){$("progress").style.width=`${100*runIndex/runs}%`;$("batchStatus").textContent=`已完成 ${runIndex.toLocaleString()} / ${runs.toLocaleString()} 局`;await new Promise(resolve=>setTimeout(resolve,0));}}$("progress").style.width="100%";$("batchStatus").className="status ok";$("batchStatus").textContent=`完成 ${runs.toLocaleString()} 局。`;$("batchOutput").innerHTML=stats.map((s,i)=>`<section class="week"><h3>第 ${i+1} 周</h3><div class="summary"><div class="card"><strong>${s.groups.toLocaleString()}</strong><small>行动组</small></div><div class="card"><strong>${s.cards.toLocaleString()}</strong><small>候选卡</small></div></div><h3>行动数</h3>${bars(s.counts,{2:"2 张",3:"3 张"},s.groups)}<h3 style="margin-top:14px">类别</h3>${bars(s.categories,CATEGORY_NAME,s.cards)}<h3 style="margin-top:14px">五种营业奖励</h3>${bars(s.rewards,REWARD_NAME,Array.from(s.rewards.values()).reduce((a,b)=>a+b,0))}</section>`).join("");$("runBatch").disabled=false;}
  async function loadFetch(){const raw={};for(const name of FILES){const response=await fetch(`${DIR}${name}.json`,{cache:"no-store"});if(!response.ok)throw new Error(`${name}.json: HTTP ${response.status}`);raw[name]=await response.json();}tables=buildTables(raw);loaded();}
  function loaded(){const kind=diagnostics.length?"":" ok";$("configStatus").className=`status${kind}`;$("configStatus").innerHTML=`已读取 ${FILES.length} 张表。行动映射 ${tables.actionMap.size} 个，事件壳 ${tables.eventActions.length} 个。${diagnostics.length?` 有 ${diagnostics.length} 条配置诊断。`:" 配置校验通过。"}`;renderSingle();}
  function selectedFilePath(file){return String(file?.webkitRelativePath||file?.name||"").replaceAll("\\","/");}
  function selectedFileKey(file){const leaf=selectedFilePath(file).split("/").pop().trim().toLowerCase();return leaf.endsWith(".json")?leaf.slice(0,-5):"";}
  async function loadFiles(fileList){try{const files=Array.from(fileList||[]),raw={},matched=[];for(const file of files){const key=selectedFileKey(file);if(!FILES.includes(key))continue;raw[key]=JSON.parse(await file.text());matched.push(selectedFilePath(file));}const missing=FILES.filter(name=>!raw[name]);if(missing.length){const examples=files.slice(0,5).map(selectedFilePath).filter(Boolean).join("、")||"无";throw new Error(`所选目录不正确：扫描 ${files.length} 个文件，只识别到 ${matched.length} 张目标表。缺少 ${missing.map(name=>`${name}.json`).join("、")}。请选择 ${CONFIG_HINT}；当前文件示例：${examples}`);}tables=buildTables(raw);loaded();}catch(error){$("configStatus").className="status error";$("configStatus").textContent=error.message;}}
  function selectTab(single){$("singlePanel").classList.toggle("hidden",!single);$("batchPanel").classList.toggle("hidden",single);$("singleTab").classList.toggle("active",single);$("batchTab").classList.toggle("active",!single);}
  $("singleTab").onclick=()=>selectTab(true);$("batchTab").onclick=()=>selectTab(false);$("runSingle").onclick=renderSingle;$("runBatch").onclick=runBatch;$("reload").onclick=()=>loadFetch().catch(error=>{$("configStatus").className="status error";$("configStatus").textContent=`自动读取失败：${error.message}`;});$("files").onchange=e=>loadFiles(e.target.files);loadFetch().catch(error=>{$("configStatus").className="status error";$("configStatus").textContent=`自动读取失败：${error.message}。请手动选择 Config 目录。`;});
  </script>
</body>
