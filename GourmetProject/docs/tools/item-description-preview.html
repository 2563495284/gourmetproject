<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>装饰品和消耗品/技能描述预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121318;
      --panel: #1b1d25;
      --panel-2: #222632;
      --text: #f2efe8;
      --muted: #aaa59b;
      --line: #343948;
      --accent: #f3b35b;
      --accent-2: #78d4ff;
      --score: #ffd166;
      --size: #78d4ff;
      --archetype: #c7a8ff;
      --semantic-context: #137a4a;
      --semantic-score: #28669c;
      --semantic-multiplier: #b23a48;
      --semantic-gold: #9a6500;
      --semantic-special: #7656a8;
      --warning: #ffd166;
      --danger: #ff8278;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #2a2430 0, var(--bg) 38rem);
      color: var(--text);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
    }

    input,
    select,
    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 14px;
    }

    select,
    button {
      padding: 0 12px;
    }

    button {
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .status.warning {
      color: var(--warning);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 148px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--panel) 0%, #171922 100%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    .card.has-issues {
      border-color: color-mix(in srgb, var(--warning) 65%, var(--line));
    }

    .card h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .food-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .food-stat {
      display: inline-flex;
      gap: 6px;
      align-items: baseline;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      font-weight: 700;
      line-height: 1.4;
    }

    .food-stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .food-stat-value {
      font-size: 15px;
      font-weight: 800;
    }

    .food-stat.score {
      border-color: color-mix(in srgb, var(--score) 48%, var(--line));
      background: color-mix(in srgb, var(--score) 8%, transparent);
    }

    .food-stat.score .food-stat-value {
      color: var(--score);
    }

    .food-stat.size {
      border-color: color-mix(in srgb, var(--size) 48%, var(--line));
      background: color-mix(in srgb, var(--size) 8%, transparent);
    }

    .food-stat.size .food-stat-value {
      color: var(--size);
    }

    .food-stat.archetype {
      border-color: color-mix(in srgb, var(--archetype) 48%, var(--line));
      background: color-mix(in srgb, var(--archetype) 8%, transparent);
    }

    .food-stat.archetype .food-stat-value {
      color: var(--archetype);
    }

    .desc {
      margin: 0;
      color: #fff7e8;
      white-space: pre-wrap;
    }

    .semantic {
      font-weight: 800;
    }

    .semantic-strong {
      color: inherit;
    }

    .semantic-context {
      color: var(--semantic-context);
    }

    .semantic-score {
      color: var(--semantic-score);
    }

    .semantic-multadd {
      color: var(--semantic-multiplier);
    }

    .semantic-multmul {
      color: #fff;
      paint-order: stroke fill;
      -webkit-text-stroke: 1px var(--semantic-multiplier);
      text-shadow:
        -1px 0 var(--semantic-multiplier),
        1px 0 var(--semantic-multiplier),
        0 -1px var(--semantic-multiplier),
        0 1px var(--semantic-multiplier);
    }

    .semantic-gold {
      color: var(--semantic-gold);
    }

    .semantic-term,
    .semantic-benefit {
      color: var(--semantic-special);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
    }

    .pill.accent {
      border-color: color-mix(in srgb, var(--accent-2) 55%, var(--line));
      color: var(--accent-2);
    }

    .issues,
    .terms,
    .details {
      display: grid;
      gap: 6px;
    }

    .issue,
    .term,
    .detail {
      padding: 7px 9px;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .issue {
      border: 1px solid color-mix(in srgb, var(--warning) 55%, var(--line));
      background: color-mix(in srgb, var(--warning) 8%, transparent);
      color: var(--warning);
      font-size: 12px;
    }

    .term {
      border-left: 3px solid var(--accent-2);
      background: rgba(120, 212, 255, 0.06);
      color: #dff5ff;
      font-size: 13px;
    }

    .term > strong {
      color: var(--accent-2);
    }

    .detail {
      overflow-wrap: anywhere;
      border: 1px dashed var(--line);
      color: var(--muted);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .empty {
      padding: 32px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>装饰品和消耗品/技能描述预览</h1>
    <p class="lead">读取 <code>Assets/StreamingAssets/Config</code>，把描述模板里的参数占位符回填后展示。</p>

    <section class="toolbar" aria-label="筛选工具">
      <input id="search" type="search" placeholder="搜索名称、描述或 id" autocomplete="off">
      <select id="mode">
        <option value="dish">食物技能拼接（TbSkill）</option>
        <option value="item">装饰品和消耗品描述（TbPassiveItem / TbActiveItem）</option>
      </select>
      <button id="toggleParams" type="button" aria-pressed="false">显示参数</button>
    </section>

    <p id="status" class="status">正在加载配置...</p>
    <section id="list" class="grid" aria-live="polite"></section>
  </main>

  <script>
    const CONFIG_BASE = "../../Assets/StreamingAssets/Config/";
    const SKILL_SEPARATOR = "。\n";
    const FOOD_ARCHETYPES = Object.freeze([
      "甜蜜传递",
      "份数",
      "蛋糕",
    ]);
    const SEMANTIC_TAGS = Object.freeze(new Set([
      "strong",
      "context",
      "score",
      "multadd",
      "multmul",
      "gold",
      "term",
      "benefit",
    ]));
    const SEMANTIC_TERM_ALLOWLIST = Object.freeze(new Set([
      "甜蜜传递",
      "欢乐蛋糕",
      "蛋糕",
      "消耗品",
      "装饰品",
      "丢弃",
    ]));
    const SEMANTIC_STRONG_ALLOWLIST = Object.freeze(new Set([
      "份数",
      "分数",
      "倍率",
    ]));
    const SEMANTIC_BENEFIT_ALLOWLIST = Object.freeze(new Set([
      "额外视为",
      "额外被视为",
      "额外选择",
      "额外结算",
      "执行",
    ]));

    const state = {
      mode: "dish",
      query: "",
      showParams: false,
      data: null,
    };

    const SkillScope = {
      0: "Self",
      1: "Adjacent",
      2: "Row",
      3: "Column",
      4: "All",
      5: "Empty",
      6: "Edge",
      7: "Before",
      8: "After",
      9: "Recipe",
      10: "Category",
      11: "Round",
      12: "RoundAndSelf",
      13: "RowAndSelf",
      14: "ColumnAndSelf",
      15: "Other",
      16: "CakeBuff",
      17: "Left",
      18: "Up",
      19: "Right",
      20: "Down",
      21: "LeftAndSelf",
      22: "UpAndSelf",
      23: "RightAndSelf",
      24: "DownAndSelf",
      25: "RowAndColumn",
    };
    const CountUnit = Object.freeze({
      Instances: 0,
      Kinds: 1,
      PhysicalInstances: 2,
    });
    const SkillConditionType = Object.freeze({
      EmptyCell: 2,
      TagCount: 10,
      OccupiedCell: 14,
      SkillTypeCount: 16,
      SkillCount: 17,
    });

    const searchInput = document.getElementById("search");
    const modeSelect = document.getElementById("mode");
    const toggleParams = document.getElementById("toggleParams");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value.trim().toLowerCase();
      render();
    });

    modeSelect.addEventListener("change", () => {
      state.mode = modeSelect.value;
      render();
    });

    toggleParams.addEventListener("click", () => {
      state.showParams = !state.showParams;
      toggleParams.setAttribute("aria-pressed", String(state.showParams));
      toggleParams.textContent = state.showParams ? "隐藏参数" : "显示参数";
      render();
    });

    boot();

    async function boot() {
      try {
        const [passiveItems, activeItems, dishes, skills, subSkills, terms] = await Promise.all([
          loadJson("tbpassiveitem"),
          loadJson("tbactiveitem"),
          loadJson("tbdishbase"),
          loadJson("tbskill"),
          loadJson("tbsubskill"),
          loadJson("tbterm"),
        ]);

        state.data = {
          items: [
            ...passiveItems.map(item => ({ ...item, itemKind: "Passive" })),
            ...activeItems.map(item => ({ ...item, itemKind: "Active" })),
          ],
          dishes,
          skillsById: indexById(skills),
          subSkillsById: indexById(subSkills),
          termsById: indexById(terms),
        };

        render();
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = `配置加载失败：${error.message}。请通过本地 HTTP 服务打开本页，例如在项目根目录运行 python3 -m http.server。`;
      }
    }

    async function loadJson(name) {
      const response = await fetch(`${CONFIG_BASE}${name}.json`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${name}.json HTTP ${response.status}`);
      }

      return response.json();
    }

    function indexById(rows) {
      return Object.fromEntries((rows || []).map(row => [row.id, row]));
    }

    function render() {
      if (!state.data) {
        return;
      }

      const rows = state.mode === "item" ? buildItemRows() : buildDishRows();
      const filtered = filterRows(rows);
      const issueCount = filtered.reduce((sum, row) => sum + (row.issues || []).length, 0);

      statusEl.className = issueCount > 0 ? "status warning" : "status";
      statusEl.textContent = `共 ${rows.length} 条，当前显示 ${filtered.length} 条${issueCount > 0 ? `，发现 ${issueCount} 个问题` : "，占位符均已解析"}。`;
      listEl.innerHTML = filtered.length > 0
        ? filtered.map(renderCard).join("")
        : `<div class="empty">没有匹配结果。</div>`;
    }

    function buildDishRows() {
      const { dishes, skillsById, subSkillsById, termsById } = state.data;

      return dishes.map(dish => {
        const skillIds = splitPipe(dish.skills);
        const skillDescs = skillIds.map(skillId => {
          const skill = skillsById[skillId];
          if (!skill) {
            return {
              id: skillId,
              desc: `缺少技能配置：${skillId}`,
              subSkillIds: [],
              components: [],
              terms: [],
              issues: [`缺少技能配置：${skillId}`],
            };
          }

          const subSkillIds = splitPipe(skill.subSkills);
          const components = subSkillIds.map((subSkillId, order) => {
            const subSkill = subSkillsById[subSkillId];
            if (!subSkill) {
              return {
                id: subSkillId,
                template: "",
                desc: `缺少子技能配置：${subSkillId}`,
                terms: [],
                issues: [`缺少子技能配置：${subSkillId}`],
                details: [],
              };
            }

            const rule = {
              order,
              condType: subSkill.condType,
              condScope: subSkill.condScope,
              condUnit: subSkill.condUnit,
              condParam: subSkill.condParam || "",
              actionScope: subSkill.actionScope,
              actionCount: subSkill.actionCount || 0,
              actionValues: Array.isArray(subSkill.actionValue) ? subSkill.actionValue : [],
              actionParams: Array.isArray(subSkill.actionParam) ? subSkill.actionParam : [],
            };

            const template = subSkill.descTemplate || "";
            const desc = composeSkillComponent(template, rule, Boolean(subSkill.signed));
            const unresolved = findUnresolvedTokens(desc);
            const issues = unresolved.length > 0
              ? [`${subSkillId} 未解析：${unresolved.join("、")}`]
              : [];
            issues.push(...findSemanticTagIssues(desc).map(issue => `${subSkillId} ${issue}`));
            const terms = splitPipe(subSkill.termId).map(termId => {
              const term = termsById[termId];
              if (!term) {
                issues.push(`${subSkillId} 缺少术语配置：${termId}`);
                return null;
              }
              issues.push(...findSemanticTagIssues(term.desc).map(issue => `${termId} ${issue}`));
              return term;
            }).filter(Boolean);

            return {
              id: subSkillId,
              template,
              desc,
              terms,
              issues: uniqueStrings(issues),
              details: [
                `sub:${subSkillId} · template:${template || "（空）"}`,
                `cond: scope=${subSkill.condScope} unit=${subSkill.condUnit} param=${subSkill.condParam || "（空）"}`,
                `action: scope=${subSkill.actionScope} count=${subSkill.actionCount || 0} value=${rule.actionValues.join("|") || "（空）"} param=${rule.actionParams.join("|") || "（空）"}`,
              ],
            };
          });

          const parts = components.map(component => component.desc).filter(Boolean);
          return {
            id: skillId,
            desc: parts.join(SKILL_SEPARATOR),
            subSkillIds,
            components,
            terms: uniqueById(components.flatMap(component => component.terms)),
            issues: uniqueStrings(components.flatMap(component => component.issues)),
          };
        });

        const terms = uniqueById(skillDescs.flatMap(skill => skill.terms));
        const issues = uniqueStrings(skillDescs.flatMap(skill => skill.issues));
        return {
          id: dish.id,
          name: dish.name || dish.id,
          desc: skillDescs.map(skill => skill.desc).filter(Boolean).join("\n"),
          foodStats: buildFoodStats(dish),
          meta: [
            `dish:${dish.id}`,
            ...skillDescs.map(skill => `skill:${skill.id}`),
            ...terms.map(term => `术语:${term.name}`),
            ...(state.showParams ? skillDescs.flatMap(skill => skill.subSkillIds.map(id => `sub:${id}`)) : []),
          ],
          terms,
          issues,
          details: state.showParams
            ? skillDescs.flatMap(skill => skill.components.flatMap(component => component.details))
            : [],
        };
      });
    }

    function buildItemRows() {
      return state.data.items.map(item => {
        const desc = composeItemDesc(item);
        const unresolved = findUnresolvedTokens(desc);
        const issues = unresolved.length > 0 ? [`未解析：${unresolved.join("、")}`] : [];
        issues.push(...findSemanticTagIssues(desc));
        return {
          id: item.id,
          name: item.name || item.id,
          desc,
          meta: [
            `item:${item.id}`,
            `kind:${item.itemKind || ""}`,
            ...(state.showParams ? [
              `effect:${item.effectType || ""}`,
              `value:${formatPlain(item.effectValue || 0)}`,
              item.effectParam ? `param:${item.effectParam}` : "",
            ].filter(Boolean) : []),
          ],
          terms: [],
          issues: uniqueStrings(issues),
          details: state.showParams ? [
            `template:${item.desc || "（空）"}`,
            `effect: type=${item.effectType || "（空）"} value=${formatPlain(item.effectValue || 0)} param=${item.effectParam || "（空）"}`,
          ] : [],
        };
      });
    }

    function composeItemDesc(item) {
      const values = [item.effectValue, ...splitParamValues(item.effectParam)];
      return String(item.desc || "").replace(/\$?\{(\d+|effectValue|effectParam|param)\}/g, (match, key) => {
        if (key === "effectValue") {
          return formatPlain(item.effectValue || 0);
        }

        if (key === "effectParam" || key === "param") {
          return item.effectParam || "";
        }

        const index = Number(key);
        return index >= 0 && index < values.length ? formatPlain(values[index]) : match;
      });
    }

    function composeSkillComponent(template, rule, signed) {
      const numberFormat = value => signed ? formatSigned(value) : formatPlain(value);

      return String(template || "").replace(/\$?\{([A-Za-z]+|\d+)\}/g, (match, key) => {
        if (/^\d+$/.test(key)) {
          const index = Number(key);
          return index >= 0 && index < rule.actionValues.length
            ? numberFormat(rule.actionValues[index])
            : match;
        }

        switch (key) {
          case "value":
            return formatPlain(rule.actionValues[0] || 0);
          case "cscope":
            return semanticScope(scopeWord(rule.condScope));
          case "ascope":
            return semanticActionScope(rule.actionScope, rule.actionCount, rule);
          case "unit":
            return countUnitWord(rule);
          case "countas":
            return String(Math.round((Number(rule.actionValues[0]) || 0)) + 1);
          case "thr":
            return String(thresholdOrDefault(rule.condParam));
          case "count":
            return String(rule.actionCount || 0);
          case "tiers":
            return joinBar(extractAfter(rule.condParam, "tiers:"));
          case "tiervals":
            return formatNumberList(
              extractAfter(findEntry(rule.actionParams, "tiervals:"), "tiervals:"),
              signed);
          case "floor":
            return extractNumber(rule.actionParams, ["multfloor:", "floor:"]);
          case "cat":
            return semanticTerm(catWord(rule));
          case "targets":
          case "atargets":
            return `${semanticActionScope(rule.actionScope, rule.actionCount, rule)}食物`;
          default:
            return match;
        }
      });
    }

    function countUnitWord(rule) {
      const condUnit = Number(rule?.condUnit);
      const condType = Number(rule?.condType);
      if (condUnit === CountUnit.Kinds) {
        return "种";
      }

      if (condUnit === CountUnit.PhysicalInstances
        || condType === SkillConditionType.SkillCount
        || condType === SkillConditionType.SkillTypeCount
        || condType === SkillConditionType.TagCount
        || condType === SkillConditionType.EmptyCell
        || condType === SkillConditionType.OccupiedCell) {
        return "个";
      }

      return "份";
    }

    function filterRows(rows) {
      if (!state.query) {
        return rows;
      }

      return rows.filter(row => {
        const haystack = [
          row.id,
          row.name,
          row.desc,
          row.foodStats?.score,
          row.foodStats?.size,
          row.foodStats?.servings,
          row.foodStats?.archetypes,
          row.foodStats?.archetypePoints,
          row.foodStats?.shape,
          ...(row.meta || []),
          ...(row.issues || []),
          ...(row.terms || []).flatMap(term => [term.name, term.desc]),
          ...(row.details || []),
        ].join(" ").toLowerCase();
        return haystack.includes(state.query);
      });
    }

    function renderCard(row) {
      const foodStats = renderFoodStats(row.foodStats);
      const meta = (row.meta || []).map((text, index) => (
        `<span class="pill ${index === 0 ? "accent" : ""}">${escapeHtml(text)}</span>`
      )).join("");
      const issues = (row.issues || []).map(text => (
        `<div class="issue">${escapeHtml(text)}</div>`
      )).join("");
      const terms = (row.terms || []).map(term => (
        `<div class="term"><strong>${escapeHtml(term.name)}</strong> · ${renderRichText(term.desc || "（无术语说明）")}</div>`
      )).join("");
      const details = (row.details || []).map(text => (
        `<div class="detail">${escapeHtml(text)}</div>`
      )).join("");

      return `
        <article class="card ${(row.issues || []).length > 0 ? "has-issues" : ""}">
          <h2>${escapeHtml(row.name)}</h2>
          ${foodStats}
          <p class="desc">${renderRichText(row.desc || "（无描述）")}</p>
          ${issues ? `<div class="issues">${issues}</div>` : ""}
          ${terms ? `<div class="terms">${terms}</div>` : ""}
          ${details ? `<div class="details">${details}</div>` : ""}
          <div class="meta">${meta}</div>
        </article>
      `;
    }

    function buildFoodStats(dish) {
      const rows = Array.isArray(dish.shapeRows)
        ? dish.shapeRows.map(row => String(row || ""))
        : [];
      const cells = rows.flatMap((row, y) => [...row]
        .map((cell, x) => /[Xx1#]/.test(cell) ? { x, y } : null)
        .filter(Boolean));
      const xs = cells.map(cell => cell.x);
      const ys = cells.map(cell => cell.y);
      const width = cells.length > 0 ? Math.max(...xs) - Math.min(...xs) + 1 : 0;
      const height = cells.length > 0 ? Math.max(...ys) - Math.min(...ys) + 1 : 0;
      const cellCount = cells.length;
      const archetype = buildFoodArchetype(dish.archetypeWeights);

      return {
        score: formatPlain(dish.deliciousness ?? 0),
        size: `${width}×${height} · ${cellCount}格`,
        servings: formatPlain(dish.countAs ?? 1),
        archetypes: archetype.label,
        archetypePoints: archetype.pointsText,
        shape: rows.join(" / "),
      };
    }

    function buildFoodArchetype(weights) {
      const source = Array.isArray(weights) ? weights : [];
      const points = FOOD_ARCHETYPES.map((_, index) => {
        const value = Number(source[index]);
        return Number.isFinite(value) && value > 0 ? value : 0;
      });
      const active = FOOD_ARCHETYPES
        .map((name, index) => ({ name, points: points[index] }))
        .filter(entry => entry.points > 0);

      return {
        label: active.length > 0
          ? active.map(entry => `${entry.name}（${formatPlain(entry.points)}点）`).join(" · ")
          : "通用",
        pointsText: FOOD_ARCHETYPES
          .map((name, index) => `${name} ${formatPlain(points[index])}`)
          .join("｜"),
      };
    }

    function renderFoodStats(stats) {
      if (!stats) {
        return "";
      }

      return `
        <div class="food-stats" aria-label="食物基础属性">
          <span class="food-stat size" title="形状：${escapeHtml(stats.shape || "（空）")}">
            <span class="food-stat-label">大小</span>
            <strong class="food-stat-value">${escapeHtml(stats.size)}</strong>
          </span>
          <span class="food-stat score">
            <span class="food-stat-label">基础分</span>
            <strong class="food-stat-value">${escapeHtml(stats.score)}</strong>
          </span>
          <span class="food-stat servings" title="食物本体的静态有效份数">
            <span class="food-stat-label">份数</span>
            <strong class="food-stat-value">${escapeHtml(stats.servings)}</strong>
          </span>
          <span class="food-stat archetype" title="流派点数：${escapeHtml(stats.archetypePoints)}">
            <span class="food-stat-label">所属流派</span>
            <strong class="food-stat-value">${escapeHtml(stats.archetypes)}</strong>
          </span>
        </div>
      `;
    }

    function renderRichText(value) {
      const source = String(value ?? "");
      const semanticTagsAreValid = findSemanticTagIssues(source).length === 0;
      const tagPattern = /<\/?b>|<\/color>|<color\s*=\s*(?:"[^"]*"|'[^']*'|[^>]+)>|<#[0-9a-f]{3,8}>|\[\/?(?:strong|context|score|multadd|multmul|gold|term|benefit)\]/gi;
      const stack = [];
      let result = "";
      let cursor = 0;

      for (const match of source.matchAll(tagPattern)) {
        result += escapeHtml(source.slice(cursor, match.index));
        const rawTag = match[0];

        const semanticMatch = rawTag.match(/^\[(\/)?([A-Za-z][A-Za-z0-9_-]*)\]$/);
        if (semanticMatch) {
          if (!semanticTagsAreValid) {
            result += escapeHtml(rawTag);
          } else {
            const closing = Boolean(semanticMatch[1]);
            const name = semanticMatch[2].toLowerCase();
            const type = `semantic:${name}`;
            if (closing) {
              result += closeRichTextTag(stack, type, rawTag);
            } else {
              result += `<strong class="semantic semantic-${name}">`;
              stack.push({ type, close: "</strong>" });
            }
          }
        } else if (/^<b>$/i.test(rawTag)) {
          result += "<strong>";
          stack.push({ type: "bold", close: "</strong>" });
        } else if (/^<\/b>$/i.test(rawTag)) {
          result += closeRichTextTag(stack, "bold", rawTag);
        } else if (/^<\/color>$/i.test(rawTag)) {
          result += closeRichTextTag(stack, "color", rawTag);
        } else {
          const color = parseRichTextColor(rawTag);
          if (color) {
            result += `<span style="color:${color}">`;
            stack.push({ type: "color", close: "</span>" });
          } else {
            result += escapeHtml(rawTag);
          }
        }

        cursor = match.index + rawTag.length;
      }

      result += escapeHtml(source.slice(cursor));
      while (stack.length > 0) {
        result += stack.pop().close;
      }
      return result;
    }

    function closeRichTextTag(stack, type, rawTag) {
      if (stack.length === 0 || stack[stack.length - 1].type !== type) {
        return escapeHtml(rawTag);
      }

      return stack.pop().close;
    }

    function parseRichTextColor(rawTag) {
      const shorthand = rawTag.match(/^<(#[0-9a-f]{3,8})>$/i);
      if (shorthand) {
        return normalizeRichTextColor(shorthand[1]);
      }

      const full = rawTag.match(/^<color\s*=\s*(?:"([^"]*)"|'([^']*)'|([^>]+))>$/i);
      return full ? normalizeRichTextColor(full[1] ?? full[2] ?? full[3]) : "";
    }

    function normalizeRichTextColor(value) {
      const color = String(value || "").trim().toLowerCase();
      if (/^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color)) {
        return color;
      }

      const namedColors = {
        black: "#000000",
        blue: "#0000ff",
        green: "#00ff00",
        grey: "#808080",
        lightblue: "#add8e6",
        orange: "#ff8000",
        purple: "#a020f0",
        red: "#ff0000",
        white: "#ffffff",
        yellow: "#ffff00",
      };
      return namedColors[color] || "";
    }

    function findSemanticTagIssues(value) {
      const source = String(value ?? "");
      const stack = [];
      const issues = [];
      const tagPattern = /\[(\/)?([A-Za-z][A-Za-z0-9_-]*)\]/g;

      for (const match of source.matchAll(tagPattern)) {
        const closing = Boolean(match[1]);
        const name = match[2].toLowerCase();
        const rawTag = match[0];

        if (!SEMANTIC_TAGS.has(name)) {
          issues.push(`未知语义标签：${rawTag}`);
          continue;
        }

        if (!closing) {
          if (stack.length > 0) {
            issues.push(`语义标签不能嵌套：[${stack[stack.length - 1]}] 内出现 ${rawTag}`);
          }
          stack.push(name);
          continue;
        }

        if (stack.length === 0) {
          issues.push(`多余的语义结束标签：${rawTag}`);
          continue;
        }

        const expected = stack[stack.length - 1];
        if (expected !== name) {
          issues.push(`语义标签交叉：应先结束 [${expected}]，不能直接结束 ${rawTag}`);
          continue;
        }

        stack.pop();
      }

      for (const name of stack.reverse()) {
        issues.push(`语义标签未结束：[${name}]`);
      }

      for (const match of source.matchAll(/\[(term|benefit)\]([\s\S]*?)\[\/\1\]/gi)) {
        const name = match[1].toLowerCase();
        const payload = match[2];
        const allowlist = name === "term"
          ? SEMANTIC_TERM_ALLOWLIST
          : SEMANTIC_BENEFIT_ALLOWLIST;
        if (!allowlist.has(payload)) {
          issues.push(`不在${name === "term" ? "术语" : "收益"}白名单：${payload}`);
        }
      }

      for (const match of source.matchAll(/\[strong\]([\s\S]*?)\[\/strong\]/gi)) {
        const payload = match[1];
        if (!SEMANTIC_STRONG_ALLOWLIST.has(payload)) {
          issues.push(`不在加粗白名单：${payload}`);
        }
      }

      return uniqueStrings(issues);
    }

    function splitPipe(value) {
      return String(value || "")
        .split("|")
        .map(part => part.trim())
        .filter(Boolean);
    }

    function splitParamValues(value) {
      return String(value || "")
        .split(/[|,;]/)
        .map(part => part.trim())
        .filter(Boolean);
    }

    function formatPlain(value) {
      const number = Number(value);
      if (Number.isFinite(number)) {
        return Number.isInteger(number) ? String(number) : trimFloat(number);
      }

      return String(value ?? "");
    }

    function formatSigned(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return String(value ?? "");
      }

      if (Math.abs(number) < 0.000001) {
        return "0";
      }

      return `${number > 0 ? "+" : ""}${trimFloat(number)}`;
    }

    function trimFloat(number) {
      return number.toFixed(6).replace(/\.?0+$/, "");
    }

    function scopeWord(scopeValue) {
      switch (SkillScope[Number(scopeValue)]) {
        case "Self": return "";
        case "Adjacent": return "相邻";
        case "Round": return "周围";
        case "Row": return "同行";
        case "Column": return "同列";
        case "RowAndColumn": return "同行同列";
        case "RoundAndSelf": return "周围及自身";
        case "RowAndSelf": return "本行";
        case "ColumnAndSelf": return "本列";
        case "All": return "全场";
        case "Other": return "其他";
        case "CakeBuff": return "欢乐蛋糕";
        case "Category": return "指定分类";
        case "Left": return "左侧";
        case "Up": return "上侧";
        case "Right": return "右侧";
        case "Down": return "下侧";
        case "LeftAndSelf": return "左侧及自身";
        case "UpAndSelf": return "上侧及自身";
        case "RightAndSelf": return "右侧及自身";
        case "DownAndSelf": return "下侧及自身";
        default: return "";
      }
    }

    function actionScopeText(scopeValue, count, rule) {
      const scope = SkillScope[Number(scopeValue)];
      const normalizedCount = Number(count) || 0;

      if (scope === "Self") {
        return "";
      }

      if (normalizedCount <= 0) {
        switch (scope) {
          case "Adjacent": return "相邻";
          case "Round": return "周围";
          case "Row": return "同行";
          case "Column": return "同列";
          case "RowAndColumn": return "同行同列";
          case "RoundAndSelf": return "周围及自身";
          case "RowAndSelf": return "本行";
          case "ColumnAndSelf": return "本列";
          case "All": return "所有";
          case "Other": return "其他";
          case "CakeBuff": return "欢乐蛋糕";
          case "Category": return catWord(rule) ? `所有${catWord(rule)}` : "指定分类";
          case "Left": return "左侧";
          case "Up": return "上侧";
          case "Right": return "右侧";
          case "Down": return "下侧";
          case "LeftAndSelf": return "左侧及自身";
          case "UpAndSelf": return "上侧及自身";
          case "RightAndSelf": return "右侧及自身";
          case "DownAndSelf": return "下侧及自身";
          default: return scopeWord(scopeValue);
        }
      }

      switch (scope) {
        case "Adjacent": return `相邻 ${normalizedCount} 个`;
        case "Round": return `周围 ${normalizedCount} 个`;
        case "Row": return `同行 ${normalizedCount} 个`;
        case "Column": return `同列 ${normalizedCount} 个`;
        case "RowAndColumn": return `同行同列 ${normalizedCount} 个`;
        case "RoundAndSelf": return `周围及自身 ${normalizedCount} 个`;
        case "RowAndSelf": return `本行 ${normalizedCount} 个`;
        case "ColumnAndSelf": return `本列 ${normalizedCount} 个`;
        case "All": return `${normalizedCount} 个`;
        case "Other": return `其他 ${normalizedCount} 个`;
        case "Left": return `左侧 ${normalizedCount} 个`;
        case "Up": return `上侧 ${normalizedCount} 个`;
        case "Right": return `右侧 ${normalizedCount} 个`;
        case "Down": return `下侧 ${normalizedCount} 个`;
        case "LeftAndSelf": return `左侧及自身 ${normalizedCount} 个`;
        case "UpAndSelf": return `上侧及自身 ${normalizedCount} 个`;
        case "RightAndSelf": return `右侧及自身 ${normalizedCount} 个`;
        case "DownAndSelf": return `下侧及自身 ${normalizedCount} 个`;
        case "Category": return catWord(rule) ? `${catWord(rule)} ${normalizedCount} 个` : `指定分类 ${normalizedCount} 个`;
        default: return scopeWord(scopeValue);
      }
    }

    function semanticScope(scope) {
      return scope ? `[context]${scope}[/context]` : "";
    }

    function semanticTerm(term) {
      return SEMANTIC_TERM_ALLOWLIST.has(term) ? `[term]${term}[/term]` : (term || "");
    }

    function semanticActionScope(scopeValue, count, rule) {
      const phrase = actionScopeText(scopeValue, count, rule);
      if (!phrase) {
        return "";
      }

      const normalizedCount = Number(count) || 0;
      if (normalizedCount <= 0) {
        return semanticScope(phrase);
      }

      const core = scopeWord(scopeValue);
      if (!core || !phrase.startsWith(core)) {
        return phrase;
      }

      return `${semanticScope(core)}${phrase.slice(core.length)}`;
    }

    function thresholdOrDefault(condParam) {
      for (const rawSegment of String(condParam || "").split(";")) {
        const segment = rawSegment.trim();
        if (!segment) {
          continue;
        }

        const symbol = segment.match(/^(>=|<=|==|>|<|=)\s*(-?\d+)/);
        if (symbol) {
          return Number(symbol[2]);
        }

        const pair = segment.match(/^([A-Za-z]+)\s*[:=]\s*(-?\d+)/);
        if (!pair) {
          const plain = Number(segment);
          if (Number.isInteger(plain)) {
            return plain;
          }
          continue;
        }

        if (["gte", "ge", "min", "lte", "le", "max", "eq", "gt", "lt", "thr", "threshold"].includes(pair[1].toLowerCase())) {
          return Number(pair[2]);
        }
      }

      return 0;
    }

    function catWord(rule) {
      let cat = extractAfter(findEntry(rule.actionParams, "cat:"), "cat:");
      if (!cat) {
        cat = extractAfter(rule.condParam, "cat:");
      }
      if (!cat) {
        cat = categoryFromCondition(rule.condParam);
      }

      switch (cat) {
        case "cake": return "蛋糕";
        case "": return "";
        default: return cat;
      }
    }

    function findEntry(parameters, token) {
      return (parameters || []).find(value => String(value || "").toLowerCase().includes(token.toLowerCase())) || "";
    }

    function extractAfter(source, token) {
      if (!source || !token) {
        return "";
      }

      const lowerSource = String(source).toLowerCase();
      const lowerToken = token.toLowerCase();
      const index = lowerSource.indexOf(lowerToken);
      if (index < 0) {
        return "";
      }

      const body = String(source).slice(index + token.length);
      const end = body.indexOf(";");
      return (end >= 0 ? body.slice(0, end) : body).trim();
    }

    function extractNumber(parameters, tokens) {
      for (const token of tokens) {
        const value = extractAfter(findEntry(parameters, token), token);
        if (value) {
          return value;
        }
      }

      return "";
    }

    function joinBar(raw) {
      return String(raw || "")
        .split(/[|,]/)
        .map(part => part.trim())
        .filter(Boolean)
        .join("/");
    }

    function formatNumberList(raw, signed) {
      return String(raw || "")
        .split(/[|,]/)
        .map(part => part.trim())
        .filter(Boolean)
        .map(value => signed ? formatSigned(value) : formatPlain(value))
        .join("/");
    }

    function categoryFromCondition(condParam) {
      const controlPrefixes = ["tiers:", "div:", "include:", "source:", "skilltype:", "cat:"];
      for (const rawSegment of String(condParam || "").split(";")) {
        const segment = rawSegment.trim();
        if (segment && !controlPrefixes.some(prefix => segment.toLowerCase().startsWith(prefix))) {
          return segment;
        }
      }
      return "";
    }

    function findUnresolvedTokens(value) {
      return [...new Set(String(value || "").match(/\$?\{[^{}]+\}/g) || [])];
    }

    function uniqueById(rows) {
      return [...new Map((rows || []).map(row => [row.id, row])).values()];
    }

    function uniqueStrings(values) {
      return [...new Set(values || [])];
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
